# S9A.3 host-level nginx reverse proxy for kfitpulse.io.
# API/client are bound to 127.0.0.1 only by docker-compose.prod.yml.
# Keep this proxy on the host: production Express trusts loopback proxies only.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream kfit_api {
    server 127.0.0.1:13000;
    keepalive 16;
}

upstream kfit_client {
    server 127.0.0.1:18080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name kfitpulse.io www.kfitpulse.io;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://kfitpulse.io$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.kfitpulse.io;

    ssl_certificate /etc/letsencrypt/live/kfitpulse.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kfitpulse.io/privkey.pem;

    return 301 https://kfitpulse.io$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name kfitpulse.io;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/kfitpulse.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kfitpulse.io/privkey.pem;

    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        proxy_pass http://kfit_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Mirror packages/client/vite.config.ts API roots exactly.
    # Do not proxy all /admin or /public paths: those namespaces also contain SPA routes.
    location ~ ^/(auth|catalogue|requests)(?:/|$) {
        proxy_pass http://kfit_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ ^/admin/(catalogue|requests|customers|prospects|retention-holds|subscriptions|consent-definitions|appointments|today|dashboard|notifications|notification-settings|follow-ups|goals|payment-plans|payment-events|receipts|receipt-links|payment-proofs|payment-proof-links|quotes|quote-versions|quote-links|questionnaire-templates|questionnaire-assignments|documents|document-versions|document-delivery-links|progress-measurements|supervision)(?:/|$) {
        proxy_pass http://kfit_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location ~ ^/public/(catalogue|receipts|payment-proofs|quotes|consents|appointments|questionnaires|documents)(?:/|$) {
        proxy_pass http://kfit_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        proxy_pass http://kfit_client;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
