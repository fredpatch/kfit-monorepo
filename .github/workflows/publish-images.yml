name: Publish images

# S9A.2b: validate main, build K'FIT application images on GitHub, verify them, then publish immutable GHCR refs.
# This workflow never deploys the VPS. Hostinger deployment remains an explicit pull/up action on the server.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ci:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ matrix.image }}
    needs: ci
    if: github.ref == 'refs/heads/main' && github.repository == 'fredpatch/kfit-monorepo'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: api
            dockerfile: packages/server/Dockerfile
            target: runtime
          - image: client
            dockerfile: packages/client/Dockerfile
            target: runtime
          - image: ops
            dockerfile: packages/server/Dockerfile
            target: ops
          - image: renderer
            dockerfile: packages/server/Dockerfile
            target: renderer
    env:
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,format=long
          labels: |
            org.opencontainers.image.title=kfit-${{ matrix.image }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Prepare build arguments
        id: build_args
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          PUBLIC_WHATSAPP: ${{ vars.KFIT_PUBLIC_WHATSAPP || '' }}
          PUBLIC_INSTAGRAM: ${{ vars.KFIT_PUBLIC_INSTAGRAM || '' }}
        run: |
          if [ "$IMAGE_NAME" = "client" ]; then
            {
              echo 'value<<EOF'
              echo "VITE_PUBLIC_WHATSAPP=$PUBLIC_WHATSAPP"
              echo "VITE_PUBLIC_INSTAGRAM=$PUBLIC_INSTAGRAM"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build once, loaded locally and not yet pushed
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.build_args.outputs.value }}
          cache-from: type=gha,scope=image-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.image }}

      - name: Verify the exact image that will be pushed
        run: sh ops/ci/verify-image.sh "${{ matrix.image }}" "$IMAGE:sha-$GITHUB_SHA"

      # S9B: real Chromium behind the renderer's own POST /render, with the Compose runtime settings (init, shm,
      # SYS_ADMIN for the sandbox) and no network; the preflight also proves external resources are blocked.
      - name: Verify renderer PDF rendering
        if: matrix.image == 'renderer'
        run: |
          docker run --rm --init --network none --shm-size=256m --cap-add=SYS_ADMIN \
            "$IMAGE:sha-$GITHUB_SHA" node scripts/preflight/pdf.mjs

      - name: Check source commit metadata
        run: |
          revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE:sha-$GITHUB_SHA")
          test "$revision" = "$GITHUB_SHA"

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push and record the registry digest
        env:
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          docker push "$IMAGE:sha-$GITHUB_SHA"
          ref=$(docker image inspect --format '{{ range .RepoDigests }}{{ println . }}{{ end }}' "$IMAGE:sha-$GITHUB_SHA" | grep "^$IMAGE@sha256:" | head -n 1)
          echo "$ref" | grep -Eq "^$IMAGE@sha256:[a-f0-9]{64}$" || { echo "no registry digest" >&2; exit 1; }
          mkdir -p manifest
          printf '{"image":"%s","ref":"%s","tag":"%s:sha-%s"}\n' "$IMAGE_NAME" "$ref" "$IMAGE" "$GITHUB_SHA" > "manifest/$IMAGE_NAME.json"
          echo "- $IMAGE_NAME: $ref" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload manifest part
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest-${{ matrix.image }}
          path: manifest/${{ matrix.image }}.json
          retention-days: 90

  manifest:
    name: Release manifest
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout manifest assembler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: ops/ci

      - name: Download manifest parts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: manifest-*
          merge-multiple: true
          path: parts

      - name: Assemble release-manifest.json
        run: node ops/ci/release-manifest.mjs parts release-manifest.json

      - name: Show the manifest
        run: cat release-manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-manifest-${{ github.sha }}
          path: release-manifest.json
          # The brief targets 400 days; this public repository caps artifacts at 90. The VPS keeps its own copy per release.
          retention-days: 90
