name: CI

on:
  push:
    branches: ["sprint-*"]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Pinned: ubuntu-latest moved to 26.04, whose native pg_dump emits settings PostgreSQL 16 rejects (S7.4 restore drill).
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kfit
          POSTGRES_PASSWORD: kfit
          POSTGRES_DB: kfit_test
        ports:
          # TEST-01: the integration guard accepts localhost:5433/kfit_test only, as on a dev machine.
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U kfit -d kfit_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # CI-only disposable database. Never a real environment.
      DATABASE_URL: postgresql://kfit:kfit@localhost:5433/kfit_test
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # SEC-01 D3 (CVE-2026-111497): refuse a runner below the runtime security floor.
      - name: Runtime security floor
        run: node packages/server/scripts/security/check-runtime-floor.mjs

      - name: Install (lockfile must be in sync)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Format (PRETTY-01)
        id: format_check
        run: npm run format:check

      - name: Show formatting diff on PRETTY-01 failure
        if: failure() && steps.format_check.outcome == 'failure'
        run: |
          npm run format
          git diff -- .

      - name: No long dashes (PRETTY-01)
        run: npm run lint:dashes

      - name: Documentation references and links (DOC-01)
        id: docs_check
        run: npm run docs:check

      - name: Show documentation diff on DOC-01 failure
        if: failure() && steps.docs_check.outcome == 'failure'
        run: |
          npm run docs:generate
          git diff -- docs/reference

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Drizzle schema check
        run: npm run db:check

      - name: Fail on uncommitted schema drift
        run: |
          npm run db:generate
          git diff --exit-code -- packages/server
          test -z "$(git status --porcelain -- packages/server)"

      # S7.4 native backup/restore drill: pg_dump/pg_restore must match the postgres:16 service, not the runner default.
      - name: PostgreSQL 16 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version

      # TEST-01: integration reads the root .env.test; db:test:prepare migrates and seeds the catalogue, as locally.
      # A developer's .env supplies AUTH_OTP_PEPPER to the ops:create-user tests; CI has no .env, so a synthetic one is set.
      - name: Integration database (.env.test, migrations, catalogue seed)
        run: |
          printf 'DATABASE_URL=%s\nAUTH_OTP_PEPPER=%s\n' "$DATABASE_URL" "ci-synthetic-otp-pepper-0123456789abcdef" > .env.test
          npm run db:test:prepare

      - name: Integration tests (real PostgreSQL)
        run: npm run test:integration
