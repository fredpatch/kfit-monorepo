name: Sprint 0 Schema Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  schema-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kfit
          POSTGRES_PASSWORD: kfit
          POSTGRES_DB: kfit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kfit -d kfit_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://kfit:kfit@localhost:5432/kfit_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Drizzle config/schema check
        working-directory: packages/server
        run: npm run db:check

      - name: Generate migrations
        working-directory: packages/server
        run: npm run db:generate

      - name: Apply migrations
        working-directory: packages/server
        run: npm run db:migrate
