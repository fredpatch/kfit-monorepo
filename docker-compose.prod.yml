name: kfit-prod

# S9A.2/S9A.3: production-like stack (client, api, postgres, clamav).
# PostgreSQL and ClamAV never publish host ports. API/client publish loopback-only ports for host nginx;
# public ingress is owned by host nginx on 80/443; Express trusts loopback plus the kfit_edge gateway only.
#
# Runtime environment file: KFIT_ENV_FILE (default .env.prod, copied from .env.prod.example).
# On the host: KFIT_ENV_FILE=/srv/kfit/config/.env.prod docker compose -f docker-compose.prod.yml ...
# A missing file does not block `config` or `build`; the API and PostgreSQL refuse to start without their values.
# Normal VPS releases do not build application images: KFIT_API_IMAGE/KFIT_CLIENT_IMAGE/KFIT_OPS_IMAGE
# are set to GHCR digest refs from the S9A.2b release manifest, then Compose pulls them explicitly.

# S9A.3: single source for the kfit_edge gateway. Host nginx -> 127.0.0.1:13000 reaches the API from this address
# (Docker port publishing does not keep loopback as the source), so it is both the IPAM gateway below and the one
# proxy hop the API trusts besides loopback (KFIT_TRUSTED_PROXY_IP). 10.247.13.0/24 sits outside Docker's default
# pools (172.17-31.x, 192.168.x). Never widen the trusted address to the subnet without a new security review.
x-kfit-edge-gateway: &kfit_edge_gateway 10.247.13.1

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: ${KFIT_ENV_FILE:-.env.prod}
        required: false
    volumes:
      - kfit_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - kfit_backend
    expose:
      - "5432"

  clamav:
    image: clamav/clamav:1.5.5
    restart: unless-stopped
    volumes:
      - kfit_clamav_prod_data:/var/lib/clamav
    healthcheck:
      # Script shipped in the official image (clamd PING). First start loads the signature database: long grace period.
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 6m
    # backend: clamd for the API. kfit_clamav_egress: outbound only, for freshclam signature updates.
    networks:
      - kfit_backend
      - kfit_clamav_egress
    expose:
      - "3310"

  api:
    # S9A.2b: production deployment sets KFIT_API_IMAGE to an immutable GHCR digest ref.
    # The local default keeps explicit docker compose build usable for review.
    image: ${KFIT_API_IMAGE:-kfit-prod-api:local}
    build:
      context: .
      dockerfile: packages/server/Dockerfile
      target: runtime
    restart: unless-stopped
    # Reaps Chrome child processes spawned by Puppeteer.
    init: true
    # Chrome uses /dev/shm for rendering; Docker's 64 MB default is too small for multi-page PDFs.
    shm_size: "256mb"
    # TEMPORARY EXCEPTION (Fred, 2026-11-23): in-process Puppeteer needs SYS_ADMIN for Chromium's own sandbox
    # (no --no-sandbox, no privileged mode). Accepted only for the controlled Hostinger beta with Konny/synthetic data.
    # Before any real customer data: isolate PDF rendering so this API container no longer needs the capability.
    # See exploration-cache/project/decisions.md (2026-11-23).
    cap_add:
      - SYS_ADMIN
    env_file:
      - path: ${KFIT_ENV_FILE:-.env.prod}
        required: false
    # Values bound to this topology (bind, mounts, service names) override the env file.
    environment:
      NODE_ENV: production
      KFIT_API_HOST: 0.0.0.0
      KFIT_API_PORT: "3000"
      PRIVATE_STORAGE_ROOT: /srv/kfit/private
      KFIT_PRIVACY_JOURNAL_DIR: /srv/kfit/privacy-journal
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      KFIT_TRUSTED_PROXY_IP: *kfit_edge_gateway
    volumes:
      # Host directories must exist and be writable by uid 1000 (the image's `node` user); they are never created implicitly.
      - type: bind
        source: ${KFIT_PRIVATE_HOST_DIR:-/srv/kfit/private}
        target: /srv/kfit/private
        bind:
          create_host_path: false
      - type: bind
        source: ${KFIT_PRIVACY_JOURNAL_HOST_DIR:-/srv/kfit/privacy-journal}
        target: /srv/kfit/privacy-journal
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # backend: PostgreSQL and ClamAV. edge: outbound SMTP.
    # S9A.3: host nginx reaches the API only through 127.0.0.1:13000; the hop arrives from the kfit_edge gateway,
    # which production Express trusts together with loopback (KFIT_TRUSTED_PROXY_IP above).
    networks:
      - kfit_backend
      - kfit_edge
    ports:
      - "127.0.0.1:13000:3000"

  client:
    # S9A.2b: production deployment sets KFIT_CLIENT_IMAGE to an immutable GHCR digest ref.
    image: ${KFIT_CLIENT_IMAGE:-kfit-prod-client:local}
    build:
      context: .
      dockerfile: packages/client/Dockerfile
      target: runtime
      args:
        # Non-secret public contact links baked into the SPA (optional).
        VITE_PUBLIC_WHATSAPP: ${VITE_PUBLIC_WHATSAPP:-}
        VITE_PUBLIC_INSTAGRAM: ${VITE_PUBLIC_INSTAGRAM:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - kfit_edge
    # S9A.3: SPA is reachable by host nginx only; never bind this port publicly.
    ports:
      - "127.0.0.1:18080:80"

  # TEMPORARY S9A.3 bridge (profile `mailpit-bridge`), removed in S9A.4 when real SMTP replaces it: catches the
  # API's mail so login codes can be read while no real SMTP account exists. Never part of `up -d` without the profile.
  # SMTP stays on the internal backend network (api -> mailpit:1025, no host port). Nodemailer always sends AUTH when
  # SMTP_USER is set, and the production guard requires SMTP_USER/SMTP_PASS, so Mailpit accepts any credentials over
  # plain SMTP: the network, not the password, is the boundary. The UI is published on host loopback only (SSH tunnel),
  # through its own non-internal network because Docker does not publish ports of internal-only networks.
  mailpit:
    image: axllent/mailpit:v1.33.1@sha256:aef2aacc11f075ec0fb6874275ee4a421e688e11a96ebb296134d1735c7761ce
    profiles:
      - mailpit-bridge
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    networks:
      - kfit_backend
      - kfit_mailpit_ui
    expose:
      - "1025"
    ports:
      - "127.0.0.1:8025:8025"

  # Explicit one-off tooling only (profile `ops`): never part of `docker compose up -d`, never restarted.
  # Migrations are run deliberately (S9A.6), e.g.:
  #   docker compose -f docker-compose.prod.yml --profile ops run --rm ops npm run db:migrate --workspace @kfit/server
  ops:
    # S9A.2b: one-off production tooling uses the exact release digest as the API/client release.
    image: ${KFIT_OPS_IMAGE:-kfit-prod-ops:local}
    build:
      context: .
      dockerfile: packages/server/Dockerfile
      target: ops
    profiles:
      - ops
    restart: "no"
    env_file:
      - path: ${KFIT_ENV_FILE:-.env.prod}
        required: false
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kfit_backend

volumes:
  kfit_postgres_prod_data:
  kfit_clamav_prod_data:

networks:
  kfit_backend:
    driver: bridge
    internal: true
  kfit_edge:
    driver: bridge
    ipam:
      config:
        - subnet: 10.247.13.0/24
          gateway: *kfit_edge_gateway
  # ClamAV only: gives freshclam Internet access without joining the edge network. No published port.
  kfit_clamav_egress:
    driver: bridge
  # TEMPORARY S9A.3 Mailpit bridge only: carries the loopback-published UI port. Removed with the mailpit service.
  kfit_mailpit_ui:
    driver: bridge
