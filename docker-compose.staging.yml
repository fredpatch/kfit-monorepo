name: kfit-staging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.staging
    volumes:
      - kfit_postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - kfit_backend
    expose:
      - "5432"

  auth_proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${STAGING_AUTH_PROXY_PORT:-8080}:80"
    volumes:
      - ./ops/nginx/staging-auth.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kfit_edge

volumes:
  kfit_postgres_staging_data:

networks:
  kfit_backend:
    driver: bridge
    internal: true
  kfit_edge:
    driver: bridge
