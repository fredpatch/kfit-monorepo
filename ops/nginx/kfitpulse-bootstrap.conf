# S9A.3 bootstrap config for first ACME certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name kfitpulse.io www.kfitpulse.io;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 302 https://kfitpulse.io$request_uri;
    }
}
