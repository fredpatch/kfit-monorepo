# S9A.2: static SPA server inside the client container (internal port 80, edge network only).
# No API proxying and no TLS here: the public reverse proxy is S9A.3.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Fingerprinted Vite bundles: long cache, and a missing file is a real 404 (never the SPA shell).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The SPA shell is always revalidated so a new deployment is picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
