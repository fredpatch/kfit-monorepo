name: CI

on:
  push:
    branches: [main, "sprint-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kfit
          POSTGRES_PASSWORD: kfit
          POSTGRES_DB: kfit_test
        ports:
          # TEST-01: the integration guard accepts localhost:5433/kfit_test only, as on a dev machine.
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U kfit -d kfit_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # CI-only disposable database. Never a real environment.
      DATABASE_URL: postgresql://kfit:kfit@localhost:5433/kfit_test
      PUPPETEER_SKIP_DOWNLOAD: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # SEC-01 D3 (CVE-2026-111497): refuse a runner below the runtime security floor.
      - name: Runtime security floor
        run: node packages/server/scripts/security/check-runtime-floor.mjs

      - name: Install (lockfile must be in sync)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Format (PRETTY-01)
        run: npm run format:check

      - name: No long dashes (PRETTY-01)
        run: npm run lint:dashes

      - name: Documentation references and links (DOC-01)
        run: npm run docs:check

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Drizzle schema check
        run: npm run db:check

      - name: Fail on uncommitted schema drift
        run: |
          npm run db:generate
          git diff --exit-code -- packages/server
          test -z "$(git status --porcelain -- packages/server)"

      # TEST-01: integration reads the root .env.test; db:test:prepare migrates and seeds the catalogue, as locally.
      - name: Integration database (.env.test, migrations, catalogue seed)
        run: |
          echo "DATABASE_URL=$DATABASE_URL" > .env.test
          npm run db:test:prepare

      - name: Integration tests (real PostgreSQL)
        run: npm run test:integration
