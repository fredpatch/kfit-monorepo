name: kfit-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: kfit-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kfit_dev}
      POSTGRES_USER: ${POSTGRES_USER:-kfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kfit_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kfit_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kfit} -d ${POSTGRES_DB:-kfit_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - kfit_backend

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: kfit-mailpit-dev
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - kfit_backend

  clamav:
    image: clamav/clamav:stable
    container_name: kfit-clamav-dev
    restart: unless-stopped
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - kfit_clamav_dev_data:/var/lib/clamav
    networks:
      - kfit_backend

volumes:
  kfit_postgres_dev_data:
  kfit_clamav_dev_data:

networks:
  kfit_backend:
    driver: bridge
